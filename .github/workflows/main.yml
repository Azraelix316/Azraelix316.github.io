name: Deploy React Site to GitHub Pages

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      # 1. Checkout the repository code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # You can adjust this to your preferred Node version
          cache: 'npm'

      # 3. Install dependencies and build the project
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      # 4. Deploy to GitHub Pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # Use 'dist' if you are using Vite instead of Create React App
